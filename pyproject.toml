[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: runs several real stages together (offline, fast)",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-churn-pipeline"
version = "0.1.0"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
files = ["main.py", "src"]

[tool.ruff]
target-version = "py312"

[tool.coverage.report]
skip_empty = true
